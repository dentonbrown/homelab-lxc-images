image:
  distribution: alpine
  # Pinned to a specific *patch* release on purpose (avoids silent
  # drift, and the minirootfs filename needs the full version anyway —
  # "3.24" alone resolves to an empty version segment in the URL) —
  # check https://alpinelinux.org/releases/ periodically and bump this.
  release: "3.24.1"
  # Alpine's own download filenames use "x86_64", not "amd64".
  architecture: x86_64
  description: >-
    Alpine + Docker + Compose v2 — base image for the "one LXC per
    service, Docker inside" pattern. No app baked in; that's supplied
    per-instance via a docker-compose.yml. Logic mirrors
    community-scripts/ProxmoxVE's alpine-docker.sh, rebuilt declaratively.

source:
  downloader: alpinelinux-http
  url: https://dl-cdn.alpinelinux.org/alpine/
  keys:
    - 0482D84022F52DF1C4E7CD43293ACD0907D9495A
  keyserver: keyserver.ubuntu.com

packages:
  manager: apk
  update: true
  cleanup: true
  sets:
    - packages:
        # alpine-base pulls in OpenRC — the raw minirootfs this build
        # starts from doesn't include an init system at all, so
        # `rc-update`/`rc-service` don't exist without this.
        - alpine-base
        - tzdata
        - openssl
        - docker
      action: install

actions:
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eu

      # Alpine uses OpenRC, not systemd.
      rc-update add docker default

      # Docker Compose v2 CLI plugin — pulled from GitHub releases rather
      # than apk, matching what community-scripts' alpine-docker.sh does
      # (Alpine's apk repos don't reliably carry an up-to-date compose
      # v2 package). Picks up whatever's current at image-build time.
      mkdir -p /root/.docker/cli-plugins
      COMPOSE_VERSION=$(wget -qO- https://api.github.com/repos/docker/compose/releases/latest \
        | grep '"tag_name"' | cut -d '"' -f4)
      wget -qO /root/.docker/cli-plugins/docker-compose \
        "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
      chmod +x /root/.docker/cli-plugins/docker-compose

      # Deliberately NOT done here, unlike the original script's optional
      # extras:
      #   - No Docker TCP socket (0.0.0.0:2375) — unauthenticated remote
      #     Docker API access is a real risk on a LAN; enable per-instance
      #     later, deliberately, if something actually needs it.
      #   - No Portainer — a GUI, orthogonal to managing this via code.
