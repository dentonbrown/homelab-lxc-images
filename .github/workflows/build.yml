name: Build and publish images

on:
  push:
    branches: [main]
    paths:
      - "alpine-nginx/**"
      - "alpine-docker/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [alpine-nginx, alpine-docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install distrobuilder
        env:
          # distrobuilder's own Makefile sets these — they stub out the
          # containers_image storage backends (gpgme/btrfs/devicemapper),
          # which otherwise need cgo headers we don't have and dragged in
          # a broken transitive dependency version when left enabled.
          # Building this way avoids both problems, matching upstream's
          # own build process rather than improvising one.
          GOFLAGS: -tags=containers_image_storage_stub,containers_image_docker_daemon_stub,containers_image_openpgp
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg zstd xz-utils git
          # go install pkg@tag failed (wanted a nested-module-style tag,
          # "distrobuilder/v3.3.1", that doesn't exist) — building from a
          # cloned checkout at the tag sidesteps that resolver quirk
          # entirely, and matches how upstream actually builds it.
          git clone --depth 1 --branch v3.3.1 https://github.com/lxc/distrobuilder.git /tmp/distrobuilder-src
          (cd /tmp/distrobuilder-src && go install -v ./...)

      - name: Build image
        working-directory: ${{ matrix.image }}
        run: sudo "$(go env GOPATH)/bin/distrobuilder" build-lxc ${{ matrix.image }}.yaml

      - name: Convert to Proxmox-compatible .tar.zst
        working-directory: ${{ matrix.image }}
        run: xz -dc rootfs.tar.xz | zstd -o ${{ matrix.image }}.tar.zst

      - name: Publish as the "${{ matrix.image }}-latest" release
        working-directory: ${{ matrix.image }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ matrix.image }}-latest --yes --cleanup-tag || true
          gh release create ${{ matrix.image }}-latest ${{ matrix.image }}.tar.zst \
            --title "${{ matrix.image }} (latest)" \
            --notes "Automated build via distrobuilder. Source: $GITHUB_SHA"
